name: Publish container

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: athena-container-test:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check fresh install and replacement
        env:
          ATHENA_IMAGE: athena-container-test:local
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:3000/setup > /dev/null
          before=$(docker compose exec -T nextapp sha256sum .runtime/auth-secret.json)
          docker compose up -d --force-recreate nextapp --wait --wait-timeout 120
          after=$(docker compose exec -T nextapp sha256sum .runtime/auth-secret.json)
          test "$before" = "$after"
      - name: Stop test installation
        if: always()
        run: docker compose down --volumes
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-assets:
    if: github.event_name == 'release'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Attach installation files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" docker-compose.yml docs/docker-install.md --clobber
